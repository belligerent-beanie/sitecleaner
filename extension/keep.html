<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keep changes on this site</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1b1b21; --muted: #5a5a66; --line: #d9d9e1; --accent: #a8115a; --on: #ffffff; --field: #ececf2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #202026; --fg: #f1f1f5; --muted: #b0b0bd; --line: #3a3a44; --accent: #ff7fb8; --on: #1b1b21; --field: #2c2c34; } }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 1.5rem; color: var(--fg); background: var(--bg); }
  h1 { font-size: 1.1rem; margin: 0 0 .75rem; }
  code { word-break: break-all; }
  p { margin: .5rem 0; }
  p.small { color: var(--muted); font-size: 13px; }
  button { font: inherit; padding: 7px 16px; cursor: pointer; margin-right: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--fg); }
  button#allow { background: var(--accent); border-color: var(--accent); color: var(--on); font-weight: 600; }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<h1>Keep your changes on <code id="site">…</code>?</h1>
<p id="what"></p>
<p class="small">This lets the extension put your changes on <strong>this site only</strong> each time you visit it. It does not read the site's pages and sends nothing anywhere.
  You can turn the site off or forget it in the extension's options.</p>
<p><button id="allow" type="button">Allow and keep</button> <button id="cancel" type="button">Cancel</button></p>
<p id="done" role="status"></p>
<script src="keep.js"></script>
</body>
</html>
