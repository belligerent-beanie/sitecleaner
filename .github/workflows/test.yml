# The `test` workflow (docs/CI_DESIGN.md): the end-to-end suite and the accessibility audit, on a Linux runner under a virtual display.
# `result` is the one check that is required for merging; `package` leaves the Web Store zip as an artifact.
name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      repeats:
        description: How many times to run the suite (each run is its own job; used to measure how often it fails)
        default: "1"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.runs.outputs.runs }}
    steps:
      - id: runs
        run: |
          n="${{ github.event.inputs.repeats || '1' }}"
          echo "runs=$(seq -s, 1 "$n" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  # Documentation-only changes (Markdown, docs/, the licences) cannot break the extension, so they skip the browser suite; `result` still reports, in seconds.
  # (A `paths-ignore` filter on the workflow would leave the required `result` check missing and block the merge, so the decision is made here instead.)
  # When in doubt (no base to compare with, a failed diff) it says the change is code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: diff
        uses: ./.github/actions/changed-code

  # The documentation is checked on every change, code or not: a code change can make a document wrong, a document change can break a link or a reference.
  # (docs/ARCHITECTURE.md, "Documentation": what each step catches.) It is part of `result`, so it is required for merging without any change to the branch rule.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Links, file and line references, commands, and the code against docs/ARCHITECTURE.md
        run: bun run test:docs
      - name: The site builds (no Markdown left unconverted, every picture exists)
        run: bun run docs
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34   # v25.0.0; rules and files in .markdownlint-cli2.jsonc

  test:
    needs: [plan, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    steps:
      # Actions are pinned to commits (the v4 / v2 tags as of 2026-11-14): this tool runs on people's pages, so its build chain is not left to a moving tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Suite and accessibility audit, under a virtual display
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" bun run test 2>&1 | tee test-output.txt
        shell: bash
        env:
          CI: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: output-${{ matrix.run }}
          path: |
            test-output.txt
            test-artifacts/
          retention-days: 14

  # One stable name for the branch rule to require, whatever the number of matrix jobs behind it.
  result:
    needs: [changes, docs, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then echo "changes: ${{ needs.changes.result }}"; exit 1; fi
          if [ "${{ needs.docs.result }}" != "success" ]; then echo "docs: ${{ needs.docs.result }}"; exit 1; fi
          if [ "${{ needs.changes.outputs.code }}" = "false" ]; then echo "documentation only: the documentation checks passed and the browser suite was skipped"; exit 0; fi
          if [ "${{ needs.test.result }}" != "success" ]; then echo "test: ${{ needs.test.result }}"; exit 1; fi

  package:
    needs: result
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - run: bun run zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sitecleaner-zip
          path: releases/*.zip
          retention-days: 30
