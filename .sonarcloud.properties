# SonarCloud's automatic analysis (the GitHub App) reads this file. Documentation is not code: leaving it out of the analysis scope means a
# documentation-only pull request has nothing for SonarCloud to analyse. (The App cannot be switched off per pull request from a workflow;
# the scope is the control it offers. The check still reports, and it is not a required check.)
sonar.exclusions=**/*.md,docs/**,LICENSE,NOTICE
